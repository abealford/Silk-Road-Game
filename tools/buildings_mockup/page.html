<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Constantinople building kit · mockup</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1018;font-family:Georgia,'Times New Roman',serif}
#c{display:block;width:100vw;height:100vh;cursor:grab}
#c:active{cursor:grabbing}
#ui{position:fixed;left:16px;top:16px;width:290px;padding:14px 16px 12px;background:rgba(24,20,16,.82);color:#efe4cf;border:1px solid rgba(230,200,150,.25);border-radius:10px;backdrop-filter:blur(4px);font-size:13px;line-height:1.45}
#ui h1{font-size:16px;font-weight:normal;margin:0 0 2px;letter-spacing:.02em;color:#f6e7c8}
#ui .sub{color:#b9a888;font-size:12px;margin-bottom:12px}
.row{margin:10px 0 4px;color:#cdbb98;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:7px 0;background:rgba(255,240,210,.07);color:#efe4cf;border:1px solid rgba(230,200,150,.25);border-radius:6px;font:inherit;cursor:pointer}
.seg button.on{background:#b5523b;border-color:#d9785c;color:#fff}
.seg button:hover:not(.on){background:rgba(255,240,210,.15)}
input[type=range]{width:100%;accent-color:#b5523b;margin:4px 0 0}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:#a8977a}
.note{margin-top:12px;padding-top:10px;border-top:1px solid rgba(230,200,150,.18);color:#b9a888;font-size:12px}
#stats{color:#d9c9a6}
kbd{font-family:inherit;background:rgba(255,240,210,.12);border-radius:3px;padding:0 4px}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Constantinople building kit</h1>
  <div class="sub">Mockup · one street on the stylized textures</div>
  <div class="row">Houses</div>
  <div class="seg" id="mode"><button data-m="today">Today</button><button data-m="kit" class="on">Kit</button></div>
  <div class="row">Time of day</div>
  <input id="time" type="range" min="0" max="1" step="0.01" value="0.35">

</div>

<script>

const LOTS = [];
{

  else { gh.push({ x: dx, yb: .18, ys: 1.98, w: 1.15, arch: true, kind: 'door' }); gh.push({ x: w * .24, yb: 1.0, ys: 1.85, w: .66, arch: true, kind: 'win' }); }
  facade(k, 0, HG, w, F, gh, wMat, wTint, true);
  k.box(-(w / 2 - T / 2), 0, -T / 2, T, HG, d - T, wMat, wTint, { grime: true }); k.box(w / 2 - T / 2, 0, -T / 2, T, HG, d - T, wMat, wTint, { grime: true });
  k.box(0, 0, -F + T / 2, w - 2 * T, HG, T, wMat, wTint, { grime: true });
  // plinth, cut at the openings
  for (const [a, b] of segs(-w / 2, w / 2, cutsAt(gh, 0, .45))) k.box((a + b) / 2, 0, F + .03, b - a, .45, .06 + .02, 'ashlar', 0xc9bba0, { grime: true });
  // opus mixtum: courses of brick through the stone
  const bands = (y0, h, holes, zF) => { if (wallT !== 'mixed') return; for (let y = .95; y < h - .3; y += 1.05) for (const [a, b] of segs(-w / 2, w / 2, cutsAt(holes, y, y + .24))) k.box((a + b) / 2, y0 + y, zF + .008, b - a, .24, .02, 'brick', trimT); };
  bands(0, HG, gh, F);
  for (const o of gh) {
    if (o.kind === 'door') {
      k.add(ringGeo(o.w / 2, o.w / 2 + .22, .07), ringM, ringT, M(o.x, o.ys, F));
      for (const sgn of [-1, 1]) k.box(o.x + sgn * (o.w / 2 + .11), .18, F + .035, .22, o.ys - .18, .07, ringM, ringT);
      k.box(o.x, 0, F - .3, o.w + .1, o.ys + o.w / 2, .08, 'boards', pick(r, PAL.door));   // the door leaf, set back in the wall
      k.box(o.x, 0, F + .35, o.w + .5, .14, .5, 'ashlar', 0xc4b79f, { grime: true });
      if (r() < .45) {   // lantern on an iron bracket
        const lx = o.x + o.w / 2 + .45; k.box(lx, 2.35, F + .2, .05, .05, .4, 'iron', 0x2a2622); k.box(lx, 2.0, F + .38, .2, .3, .2, 'lit', 0x4a3420); k.box(lx, 2.3, F + .38, .26, .05, .26, 'iron', 0x2a2622);
        k.add(PLANE, 'glow', 0xffffff, M(lx, 2.15, F + .5, 0, 0, 0, 1.6, 1.6, 1), { uv: true }); k.lights.push(k.world(lx, 2.1, F + .7));
      }
      if (r() < .5) { const px = o.x - o.w / 2 - .45; k.cyl(px, 0, F + .35, .2, .26, .5, 'brick', 0xb8734a); k.sphere(px, .75, F + .35, .32, 'leaf', 0x4f6a2e, .85); }
    } else if (o.kind === 'win') {
      k.add(ringGeo(o.w / 2, o.w / 2 + .14, .06), ringM, ringT, M(o.x, o.ys, F)); k.box(o.x, o.yb - .09, F - .05, o.w + .24, .09, .2, 'ashlar', 0xd0c4aa);
      windowFill(k, o, 0, F, r() < .5, r, 'grille');
    } else {   // shop front: stall board, counter, lintel, awning on posts, a dark shop behind
      const x0 = o.x - o.w / 2, x1 = o.x + o.w / 2;
      k.box(o.x, o.ys, F + .04, o.w + .5, .28, .1, 'planks', PAL.timber);
      k.box(o.x, .5, F + .18, o.w - .1, .08, .7, 'planks', 0x8a6040);
      const room = 1.8, rc = 0x7a6450; k.box(o.x, .05, F - T - room / 2, o.w + .3, .05, room, 'boards', 0x6a5440); k.box(o.x, 0, F - T - room, o.w + .3, HG - .2, .06, 'plaster', rc);
      for (const y of [1.0, 1.7]) k.box(o.x, y, F - T - room + .2, o.w - .2, .05, .35, 'planks', 0x8a6040);   // shelves of goods
      for (let j = 0; j < 5; j++) k.box(o.x - o.w / 2 + .4 + j * (o.w - .8) / 4, 1.05, F - T - room + .2, .28, .3, .25, 'cloth', pick(r, PAL.cloth));
      for (const sx of [x0 - .1, x1 + .1]) k.box(sx, 0, F - T - room / 2, .06, HG - .2, room, 'plaster', rc);
      k.box(o.x, HG - .3, F - T - room / 2, o.w + .3, .06, room, 'planks', 0x5a4030);
      for (let j = 0; j < 4; j++) { const gx = x0 + .35 + j * (o.w - .7) / 3; const gk = r(); if (gk < .4) k.cyl(gx, .58, F + .2, .13, .18, .42, 'brick', pick(r, [0xb8734a, 0xa8633a, 0xc9a06a]), 7); else if (gk < .7) k.sphere(gx, .78, F + .2, .24, 'cloth', pick(r, [0xc9b08a, 0xb89a6a, 0xd8c8a0]), .8); else k.box(gx, .58, F + .2, .4, .22, .4, 'planks', 0x9a7048); }
      const cl = pick(r, PAL.cloth), aw = o.w + .7, out = 1.5, drop = .55, len = Math.hypot(out, drop), a = Math.atan2(drop, out);
      k.boxC(o.x, HG - .1 - drop / 2, F + out / 2, aw, .04, len, 'cloth', cl, a);
      k.box(o.x, HG - .1 - drop - .26, F + out, aw, .26, .03, 'cloth', cl);
      for (const sx of [o.x - aw / 2 + .06, o.x + aw / 2 - .06]) k.cyl(sx, 0, F + out - .04, .045, .05, HG - .1 - drop, 'planks', PAL.timber, 6);
    }
  }
  // --- upper floors ---
  if (jetty) {   // floor beams carry the upper storey out over the street
    k.box(0, HG - .14, F + J / 2, w, .14, J + .02, 'planks', 0x7a5638);
    const n = Math.max(3, Math.round(w / .62)); for (let j = 0; j < n; j++) { const x = (j + .5 - n / 2) * w / n; k.box(x, HG - .32, F + J / 2 - .05, .14, .18, J + .3, 'planks', PAL.timberD); }
    for (const sx of [-w / 2 + .35, w / 2 - .35]) { const z0 = F, z1 = F + J - .06, y0 = HG - 1.15, y1 = HG - .3; k.boxC(sx, (y0 + y1) / 2, (z0 + z1) / 2, .13, Math.hypot(z1 - z0, y1 - y0), .13, 'planks', PAL.timberD, Math.atan2(z1 - z0, y1 - y0)); }
  }
  const nW = Math.max(1, Math.round(w / 1.9));
  for (let f = 1; f < fl; f++) {
    const y0 = HG + (f - 1) * HF, holes = [];
    for (let j = 0; j < nW; j++) { const x = (j + .5 - nW / 2) * w / nW; holes.push(jetty ? { x, yb: .85, ys: 1.95, w: .8, arch: false } : { x, yb: .8, ys: 1.72, w: .72, arch: true }); }
    facade(k, y0, HF, w, FU, holes, upMat, upTint, false);
    const DU = FU + F;   // upper depth
    k.box(-(w / 2 - T / 2), y0, (FU - F) / 2 - T / 2, T, HF, DU - T, upMat, upTint); k.box(w / 2 - T / 2, y0, (FU - F) / 2 - T / 2, T, HF, DU - T, upMat, upTint);
    k.box(0, y0, -F + T / 2, w - 2 * T, HF, T, upMat, upTint);
    if (jetty) {   // timber frame: posts, sole plate, sill and head rails
      const posts = [-w / 2 + .08, w / 2 - .08]; for (let j = 1; j < nW; j++) posts.push((j - nW / 2) * w / nW);
      for (const x of posts) k.box(x, y0, FU + .015, .16, HF, .05, 'planks', PAL.timber);
      for (const y of [0, HF - .16]) k.box(0, y0 + y, FU + .02, w, .16, .06, 'planks', PAL.timber);
      for (const o of holes) { k.box(o.x, y0 + o.yb - .14, FU + .025, o.w + .3, .14, .08, 'planks', PAL.timber); k.box(o.x, y0 + o.ys, FU + .025, o.w + .3, .14, .07, 'planks', PAL.timber); }
    } else {
      bands(y0, HF, holes, FU);
      k.box(0, y0 - .08, FU + .02, w, .16, .1 + .04, trimMat, trimT);   // string course
      for (const o of holes) { k.add(ringGeo(o.w / 2, o.w / 2 + .15, .06), ringM, ringT, M(o.x, y0 + o.ys, FU)); k.box(o.x, y0 + o.yb - .09, FU - .05, o.w + .24, .09, .2, 'ashlar', 0xd0c4aa); }
    }
    for (const o of holes) windowFill(k, o, y0, FU, r() < .55, r, 'shutters');
    if (!jetty && f === 1 && fl === 3 && r() < .5) {   // a timber balcony on the first floor
      const o = holes[Math.floor(holes.length / 2)]; const bw = Math.min(w - .6, 2.4);
      k.box(o.x, y0 - .05, FU + .45, bw, .1, .9, 'planks', 0x8a6040);
      for (let j = 0; j <= 6; j++) k.box(o.x - bw / 2 + .05 + j * (bw - .1) / 6, y0 + .05, FU + .86, .06, .85, .06, 'planks', PAL.timberD);
      k.box(o.x, y0 + .88, FU + .86, bw, .07, .08, 'planks', PAL.timberD);
      for (const sx of [o.x - bw / 2 + .2, o.x + bw / 2 - .2]) k.boxC(sx, y0 - .45, FU + .22, .1, .9, .1, 'planks', PAL.timberD, .7);
    }
  }
  // exposed corners get quoins
  if (wallT !== 'mixed') for (const sgn of [L.openL ? -1 : 0, L.openR ? 1 : 0]) { if (!sgn) continue; for (let y = .45, j = 0; y < HG - .1; y += .3, j++) { const qw = j % 2 ? .3 : .5; k.box(sgn * (w / 2 - qw / 2 + .01), y, F - .25 + .01, qw + .02, .29, .52, 'ashlar', 0xd6cab0); } }
  // --- roof: eaves to the street, beam ends, cornice, ridge, gable walls ---
  const DT = FU + F, zc = (FU - F) / 2, o = .55, half = DT / 2 + o, tp = Math.tan(PITCH);

    k.box(0, H - .26, zc + sgn * (DT / 2 + .06), w, .3, .2, trimMat, trimT);   // cornice
    const n = Math.max(3, Math.round(w / .55)); for (let j = 0; j < n; j++) { const x = (j + .5 - n / 2) * w / n; k.box(x, H + .03, zc + sgn * (DT / 2 + o / 2 - .02), .1, .13, o + .1, 'planks', PAL.timberD); }

  if (r() < .35) { const cx = (r() - .5) * w * .5, cz = zc - DT * .22; k.box(cx, H, cz, .55, rise + 1.0, .55, wMat === 'rubble' ? 'brick' : wMat, wallT === 'mixed' ? trimT : wTint); k.box(cx, H + rise + 1.0, cz, .75, .1, .75, 'ashlar', 0xc9bba0); }
}

// ---------- shared scenery: paving, ground, a church at the end of the street ----------
const common = new Kit();
common.box(0, -.06, 0, 110, .06, HW * 2, 'flags', 0xd6cbb6);
common.box(0, -.07, 0, 110, .06, .5, 'setts', 0xa89c88);   // gutter
if (LOTS.lane) common.box((LOTS.lane.x0 + LOTS.lane.x1) / 2, -.06, -HW - 12, LOTS.lane.x1 - LOTS.lane.x0, .06, 24, 'setts', 0xc6b9a0);
common.box(0, -.1, 0, 600, .06, 600, 'ground', 0xa8916f);
// back rows: simple blocks so the street sits in a city, not in a field
{ const r = rng32(99); for (const side of [-1, 1]) for (let x = -48; x < 46; x += 6 + r() * 4) { const w = 5 + r() * 3, d = 7 + r() * 3, z = side * (HW + 10.5 + d / 2 + r() * 2), h = 4.5 + r() * 3.5; common.box(x, 0, z, w, h, d, 'plaster', pick(r, PAL.plaster)); common.add(prism(w + .2, d + .8, 1.4), 'tile', pick(r, PAL.roof), M(x - (w + .2) / 2, h, z, 0, Math.PI / 2)); } }
{ // a small domed church closing the view east
  const c = common; c.push(52, 0, 0, Math.PI / 2);
  c.box(0, 0, 0, 9, 6.5, 12, 'brick', 0xc0866a, { grime: true }); for (let y = 1; y < 6; y += 1.3) c.box(0, y, 0, 9.04, .35, 12.04, 'stoneWarm', 0xdcd0b8);
  c.cyl(0, 6.5, 0, 2.6, 2.6, 1.6, 'brick', 0xc99475, 16); c.add(cached('dome', () => new THREE.SphereGeometry(2.7, 18, 9, 0, Math.PI * 2, 0, Math.PI / 2).toNonIndexed()), 'lead', 0x8e9aa0, M(0, 8.1, 0));
  c.add(prism(9.2, 12.4, 2.2), 'tile', 0xb5523b, M(-4.6, 6.5, 0, 0, Math.PI / 2)); c.pop();
  for (const [x, z] of [[46, 6.5], [46, -6.5], [-44, 5.5]]) { c.cyl(x, 0, z, .18, .22, 1.2, 'planks', 0x5e3d26, 6); c.add(cached('cyp', () => new THREE.ConeGeometry(.9, 1, 9).toNonIndexed()), 'leaf', 0x3d5a2a, M(x, 5.2, z, 0, 0, 0, 1, 8.5, 1)); }
}
const gCommon = new THREE.Group(); bake(common.parts, gCommon); scene.add(gCommon);

const today = new Kit(), kit = new Kit();
for (const L of LOTS) { const f = lotFrame(L); today.push(...f); todayHouse(today, L); today.pop(); kit.push(...f); kitHouse(kit, L); kit.pop(); }
const gToday = new THREE.Group(), gKit = new THREE.Group();
const triToday = bake(today.parts, gToday), triKit = bake(kit.parts, gKit);
scene.add(gToday, gKit);
const houses = LOTS.length;
document.getElementById('stats').textContent = `${houses} houses · about ${Math.round(triToday / houses)} triangles each today, ${Math.round(triKit / houses)} with the kit`;

// lamplight: a fixed pool of point lights at the lanterns (fixed count keeps shaders stable)
const POOL = kit.lights.slice(0, 12).map(p => { const l = new THREE.PointLight(0xffa04a, 0, 9, 2); l.position.copy(p); scene.add(l); return l; });

// ---------- time of day ----------
const KEYS = [
  { t: 0, el: 14, az: 2.1, sun: 0xffcf98, si: 2.3, hs: 0xb4cbe0, hg: 0xa98060, hi: 1.25, fog: 0xe6cfb0, zen: 0x6d9ccf, hor: 0xf2d6b0, lit: 0, exp: 1.0 },
  { t: .35, el: 58, az: 2.6, sun: 0xffe2b0, si: 3.0, hs: 0xbcd4e6, hg: 0xb98a5a, hi: 1.75, fog: 0xe8d3b0, zen: 0x5b8fc9, hor: 0xf3d9b0, lit: 0, exp: 1.0 },
  { t: .7, el: 5, az: 3.9, sun: 0xff9a52, si: 1.7, hs: 0x9a8cb2, hg: 0x7a5a48, hi: .85, fog: 0xc99474, zen: 0x46659a, hor: 0xf09a5a, lit: .55, exp: 1.05 },
  { t: 1, el: 38, az: 1.2, sun: 0x8fa8dc, si: .32, hs: 0x4a5f8e, hg: 0x221f2a, hi: .6, fog: 0x161d2e, zen: 0x0b1428, hor: 0x223052, lit: 1, exp: 1.2 },
];
const ca = new THREE.Color(), cb = new THREE.Color();
const lerpC = (a, b, f, out) => out.copy(ca.set(a)).lerp(cb.set(b), f);
function setTime(t) {
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1].t) i++;
  const A = KEYS[i], B = KEYS[i + 1], f = sm(0, 1, (t - A.t) / (B.t - A.t)), L = (a, b) => a + (b - a) * f;
  const el = L(A.el, B.el) * Math.PI / 180, az = L(A.az, B.az);
  sun.position.set(Math.cos(el) * Math.cos(az) * 150, Math.sin(el) * 150, Math.cos(el) * Math.sin(az) * 150); sun.target.position.set(0, 0, 0);
  lerpC(A.sun, B.sun, f, sun.color); sun.intensity = L(A.si, B.si);
  lerpC(A.hs, B.hs, f, hemi.color); lerpC(A.hg, B.hg, f, hemi.groundColor); hemi.intensity = L(A.hi, B.hi);
  lerpC(A.fog, B.fog, f, scene.fog.color); lerpC(A.zen, B.zen, f, skyU.zen.value); lerpC(A.hor, B.hor, f, skyU.hor.value);
  R.toneMappingExposure = L(A.exp, B.exp);
  const lit = L(A.lit, B.lit);
  MAT.lit.emissiveIntensity = lit * 2.0; MAT.glow.opacity = lit * .5;
  for (const l of POOL) l.intensity = gKit.visible ? lit * 3.2 : 0;
  state.t = t;
}
const state = { t: .35, mode: 'kit' };
function setMode(m) {
  state.mode = m; gKit.visible = m === 'kit'; gToday.visible = m === 'today';
  for (const b of document.querySelectorAll('#mode button')) b.classList.toggle('on', b.dataset.m === m);
  setTime(state.t);
}

// ---------- camera: drag to look, WASD to walk ----------
const cam = { pos: new V3(-30, 1.7, 0), yaw: -Math.PI / 2, pitch: 0 };
function lookAt(p, q) { cam.pos.copy(p); const d = new V3().subVectors(q, p).normalize(); cam.yaw = Math.atan2(-d.x, -d.z); cam.pitch = Math.asin(d.y); }
const VIEWS = {
  street: () => lookAt(new V3(-32, 1.7, .6), new V3(10, 3.2, -.4)),
  facade: () => lookAt(new V3(-14, 1.75, 1.3), new V3(-9, 3.4, -5)),
  lane: () => { const x = LOTS.lane ? (LOTS.lane.x0 + LOTS.lane.x1) / 2 : 6; lookAt(new V3(x + 1, 1.7, 2.4), new V3(x - 3.5, 3.6, -9)); },
  above: () => lookAt(new V3(-46, 15, 7), new V3(-12, 1, 0)),
};
function setView(v) { VIEWS[v](); }
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; cam.yaw -= (e.clientX - drag.x) * .004; cam.pitch = Math.max(-1.4, Math.min(1.4, cam.pitch - (e.clientY - drag.y) * .004)); drag = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', () => drag = null);
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyK') setMode(state.mode === 'kit' ? 'today' : 'kit'); });
addEventListener('keyup', e => keys[e.code] = false);
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => setMode(b.dataset.m));
document.querySelectorAll('#views button').forEach(b => b.onclick = () => setView(b.dataset.v));
const slider = document.getElementById('time'); slider.oninput = () => setTime(+slider.value);

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const sp = (keys.ShiftLeft || keys.ShiftRight ? 12 : 4) * dt;
  const fw = new V3(-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw)), rt = new V3(-fw.z, 0, fw.x);
  if (keys.KeyW || keys.ArrowUp) cam.pos.addScaledVector(fw, sp); if (keys.KeyS || keys.ArrowDown) cam.pos.addScaledVector(fw, -sp);
  if (keys.KeyD || keys.ArrowRight) cam.pos.addScaledVector(rt, sp); if (keys.KeyA || keys.ArrowLeft) cam.pos.addScaledVector(rt, -sp);
  if (keys.KeyE) cam.pos.y += sp; if (keys.KeyQ) cam.pos.y = Math.max(.5, cam.pos.y - sp);
  camera.position.copy(cam.pos); camera.rotation.set(cam.pitch, cam.yaw, 0, 'YXZ');
  sky.position.copy(camera.position);
  R.render(scene, camera);
  requestAnimationFrame(frame);
}
setMode('kit'); setTime(.35); setView('street');
requestAnimationFrame(frame);
window.__mock = { setMode, setTime, setView, lookAt: (a, b) => lookAt(new V3(...a), new V3(...b)), tris: { today: triToday, kit: triKit, houses }, lights: kit.lights.length, R };
})();
</script>
