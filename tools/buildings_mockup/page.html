<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Building kits · mockup</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1018;font-family:Georgia,'Times New Roman',serif}
#c{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
#c:active{cursor:grabbing}
#ui{position:fixed;left:16px;top:16px;width:300px;max-width:calc(100vw - 32px);box-sizing:border-box;padding:14px 16px 12px;background:rgba(24,20,16,.84);color:#efe4cf;border:1px solid rgba(230,200,150,.25);border-radius:10px;backdrop-filter:blur(4px);font-size:13px;line-height:1.45}
#ui h1{font-size:16px;font-weight:normal;margin:0 0 2px;letter-spacing:.02em;color:#f6e7c8}
#ui .sub{color:#b9a888;font-size:12px;margin-bottom:10px}
.row{margin:10px 0 4px;color:#cdbb98;font-size:11px;letter-spacing:.06em}
.pick{display:flex;gap:6px}
select{flex:1;min-width:0;padding:7px 8px;background:#2a231c;color:#efe4cf;border:1px solid rgba(230,200,150,.3);border-radius:6px;font:inherit;font-size:13px}
.seg{display:flex;gap:6px}
.seg button,.pick button{flex:1;padding:7px 0;background:rgba(255,240,210,.07);color:#efe4cf;border:1px solid rgba(230,200,150,.25);border-radius:6px;font:inherit;cursor:pointer}
.pick button{flex:0 0 34px}
.seg button.on{background:#b5523b;border-color:#d9785c;color:#fff}
.seg button:hover:not(.on),.pick button:hover{background:rgba(255,240,210,.15)}
button:focus-visible,select:focus-visible{outline:2px solid #e8b070;outline-offset:1px}
input[type=range]{width:100%;accent-color:#b5523b;margin:4px 0 0}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:#a8977a}
.note{margin-top:12px;padding-top:10px;border-top:1px solid rgba(230,200,150,.18);color:#b9a888;font-size:12px}
#stats{color:#d9c9a6}
kbd{font-family:inherit;background:rgba(255,240,210,.12);border-radius:3px;padding:0 4px}
@media(max-width:600px){#ui{top:auto;bottom:12px;left:12px;font-size:12px}.note{display:none}}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Building kits</h1>
  <div class="sub">Mockup · one street per culture, on the game's textures</div>
  <div class="row">Culture</div>
  <div class="pick"><button id="prev" aria-label="Previous culture">‹</button><select id="cul" aria-label="Culture"></select><button id="next" aria-label="Next culture">›</button></div>
  <div class="row">Houses</div>
  <div class="seg" id="mode"><button data-m="today">Today</button><button data-m="kit" class="on">Kit</button></div>
  <div class="row">Time of day</div>
  <input id="time" type="range" min="0" max="1" step="0.01" value="0.35" aria-label="Time of day">
  <div class="ticks"><span>Morning</span><span>Noon</span><span>Dusk</span><span>Night</span></div>
  <div class="row">View</div>
  <div class="seg" id="views"><button data-v="street">Street</button><button data-v="left">Left</button><button data-v="right">Right</button><button data-v="above">Above</button></div>
  <div class="note">Drag to look · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to walk · <kbd>Shift</kbd> faster · <kbd>K</kbd> switches houses<br><span id="stats"></span></div>
</div>
<script>/*THREE*/</script>
<script>/*TEXDATA*/</script>
<script>/*SURF*/</script>
<script>/*BUILDERS*/</script>

(() => {

</script>
</body></html>
